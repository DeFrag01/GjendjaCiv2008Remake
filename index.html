<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regjistri i Gjendjes Civile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --bg-alt: #f5f7fa;
            --text: #0f2d52;
            --text-secondary: #4a5568;
            --text-muted: #718096;
            --border: #e2e8f0;
            --accent: #1e5fa8;
            --accent-light: #e8f1fb;
            --primary: #0f2d52;
            --primary-dark: #0a1f3a;
            --spacing: 8px;
            --radius: 0px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* Header */
        .header {
            background: var(--primary);
            color: var(--bg);
            padding: 48px 32px;
            border-bottom: 4px solid var(--primary-dark);
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            font-weight: 400;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .header-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 32px;
            margin-top: 40px;
            max-width: 600px;
        }

        .stat {
            text-align: left;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0.6;
            margin-top: 4px;
        }

        /* Main */
        .main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 48px 32px;
        }

        /* Search */
        .search {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 0;
            margin-bottom: 48px;
            border: 2px solid var(--primary);
        }

        .search-input {
            padding: 16px 20px;
            font-size: 16px;
            font-family: var(--font);
            border: none;
            background: var(--bg);
            color: var(--text);
        }

        .search-input:focus {
            outline: none;
            background: var(--bg-alt);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-btn {
            padding: 16px 32px;
            font-size: 14px;
            font-weight: 600;
            font-family: var(--font);
            background: var(--primary);
            color: var(--bg);
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: background 200ms, color 200ms;
        }

        .search-btn:hover {
            background: var(--accent);
        }

        .quick-search {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            align-items: center;
        }

        .quick-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-right: 8px;
        }

        .quick-btn {
            padding: 6px 12px;
            font-size: 12px;
            font-family: var(--font);
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 200ms;
        }

        .quick-btn:hover {
            background: var(--primary);
            color: var(--bg);
            border-color: var(--primary);
        }

        /* Results */
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .results-count {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .results-count strong {
            color: var(--text);
            font-weight: 600;
        }

        /* Table */
        .table {
            width: 100%;
            border-collapse: collapse;
            border: 2px solid var(--primary);
        }

        .table th {
            text-align: left;
            padding: 12px 16px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: var(--bg-alt);
            border-bottom: 2px solid var(--primary);
        }

        .table td {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }

        .table tr {
            cursor: pointer;
            transition: background 150ms;
        }

        .table tbody tr:hover {
            background: var(--accent-light);
        }

        .person-name {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 2px;
        }

        .person-id {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
        }

        .parents {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .parents span {
            color: var(--text);
            font-weight: 500;
        }

        .date {
            font-size: 13px;
        }

        .location {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 500;
            border: 1px solid var(--border);
            margin-right: 4px;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-top: 48px;
        }

        .page-btn {
            min-width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-family: var(--font);
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 150ms;
        }

        .page-btn:hover {
            background: var(--primary);
            color: var(--bg);
            border-color: var(--primary);
        }

        .page-btn.active {
            background: var(--primary);
            color: var(--bg);
            border-color: var(--primary);
        }

        .page-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 32px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg);
            max-width: 640px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 2px solid var(--primary);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px;
            background: var(--primary);
            color: var(--bg);
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: var(--bg);
            font-size: 24px;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 150ms;
        }

        .modal-close:hover {
            opacity: 1;
        }

        .modal-body {
            padding: 32px;
        }

        .detail-section {
            margin-bottom: 32px;
        }

        .detail-section:last-child {
            margin-bottom: 0;
        }

        .detail-section-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .detail-item {
            padding: 12px 0;
        }

        .detail-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 14px;
            font-weight: 500;
        }

        .detail-value.clickable {
            color: var(--accent);
            cursor: pointer;
            transition: opacity 150ms;
        }

        .detail-value.clickable:hover {
            opacity: 0.7;
        }

        .detail-value.small {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .family-member {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: padding-left 150ms;
        }

        .family-member:hover {
            padding-left: 8px;
        }

        .family-member:last-child {
            border-bottom: none;
        }

        .family-name {
            font-weight: 500;
        }

        .family-role {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 80px 20px;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .no-results {
            text-align: center;
            padding: 80px 20px;
            border: 2px solid var(--border);
        }

        .no-results h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .no-results p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                padding: 32px 20px;
            }
            
            .header h1 {
                font-size: 24px;
            }
            
            .header-stats {
                grid-template-columns: repeat(3, 1fr);
                gap: 16px;
            }
            
            .stat-value {
                font-size: 24px;
            }
            
            .main {
                padding: 32px 20px;
            }
            
            .search {
                grid-template-columns: 1fr;
            }
            
            .table th:nth-child(3),
            .table td:nth-child(3),
            .table th:nth-child(5),
            .table td:nth-child(5) {
                display: none;
            }
            
            .detail-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <h1>Regjistri i Gjendjes Civile</h1>
            <p>Republika e Shqipërisë — Nëntor 2008</p>
            <div class="header-stats">
                <div class="stat">
                    <div class="stat-value" id="statTotal">—</div>
                    <div class="stat-label">Të Dhëna</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="statLastNames">—</div>
                    <div class="stat-label">Mbiemra</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="statFirstNames">—</div>
                    <div class="stat-label">Emra</div>
                </div>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="search">
            <input type="text" id="searchInput" class="search-input" placeholder="Kërko emër, mbiemër, ID..." autocomplete="off">
            <button class="search-btn" onclick="performSearch()">Kërko</button>
        </div>
        <div class="quick-search">
            <span class="quick-label">Kërkime të shpejta:</span>
            <button class="quick-btn" onclick="quickSearch('HOXHA')">HOXHA</button>
            <button class="quick-btn" onclick="quickSearch('BANO')">BANO</button>
            <button class="quick-btn" onclick="quickSearch('HADERI')">HADERI</button>
            <button class="quick-btn" onclick="quickSearch('DUKA')">DUKA</button>
            <button class="quick-btn" onclick="quickSearch('XHUVANI')">XHUVANI</button>
        </div>

        <div class="results-header">
            <span class="results-count" id="resultsCount"></span>
        </div>

        <div id="results"></div>
        <div id="pagination" class="pagination"></div>
    </main>

    <div style="text-align:center;padding:32px 0 16px;font-size:11px;color:var(--text-muted);border-top:1px solid var(--border);margin-top:48px;text-transform:uppercase;letter-spacing:0.06em;">
        &copy; 2024 DeFrag01
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title" id="modalTitle"></span>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let totalPages = 1;
        let currentQuery = '';

        async function api(endpoint) {
            const res = await fetch(`/api/${endpoint}`);
            return res.json();
        }

        function loadStats() {
            api('stats').then(data => {
                document.getElementById('statTotal').textContent = data.total?.toLocaleString() || '0';
                document.getElementById('statLastNames').textContent = data.uniqueLastNames?.toLocaleString() || '0';
                document.getElementById('statFirstNames').textContent = data.uniqueFirstNames?.toLocaleString() || '0';
            });
        }

        function performSearch() {
            currentQuery = document.getElementById('searchInput').value.trim();
            currentPage = 1;
            search();
        }

        function quickSearch(term) {
            document.getElementById('searchInput').value = term;
            performSearch();
        }

        function search() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            `;
            document.getElementById('resultsCount').textContent = 'Duke ngarkuar...';

            api(`search?q=${encodeURIComponent(currentQuery)}&page=${currentPage}`).then(data => {
                totalPages = data.pages;
                renderResults(data.results);
                renderPagination();
                document.getElementById('resultsCount').innerHTML = 
                    `<strong>${data.total.toLocaleString()}</strong> rezultate${currentQuery ? ` për "${currentQuery}"` : ''}`;
            });
        }

        function formatDate(dateStr) {
            if (!dateStr) return '—';
            return dateStr.split(' ')[0] || '—';
        }

        function renderResults(results) {
            const resultsDiv = document.getElementById('results');
            
            if (!results || results.length === 0) {
                resultsDiv.innerHTML = `
                    <div class="no-results">
                        <h3>Nuk u gjet asnjë rezultat</h3>
                        <p>Provoni të ndryshoni kërkimin tuaj</p>
                    </div>
                `;
                return;
            }

            resultsDiv.innerHTML = `
                <table class="table">
                    <thead>
                        <tr>
                            <th>Emri</th>
                            <th>Prindërit</th>
                            <th>Lindja</th>
                            <th>Gjendja</th>
                            <th>Qyteti</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${results.map(p => `
                            <tr onclick="showPerson(${p.id})">
                                <td>
                                    <div class="person-name">${p.emer || ''} ${p.mbiemer || ''}</div>
                                    <div class="person-id">ID: ${p.kryefId || '—'}</div>
                                </td>
                                <td class="parents">
                                    Atë: <span>${p.atesi || '—'}</span><br>
                                    Nënë: <span>${p.amesi || '—'}</span>
                                </td>
                                <td class="date">${formatDate(p.dtlindja)}</td>
                                <td>
                                    <span class="badge">${p.seksi || '—'}</span>
                                    <span class="badge">${p.gjCivile || '—'}</span>
                                </td>
                                <td class="location">${p.qyteti || '—'}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function renderPagination() {
            const paginationDiv = document.getElementById('pagination');
            if (totalPages <= 1) {
                paginationDiv.innerHTML = '';
                return;
            }

            let html = '';
            html += `<button class="page-btn" onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>←</button>`;
            
            const start = Math.max(1, currentPage - 2);
            const end = Math.min(totalPages, currentPage + 2);
            
            if (start > 1) {
                html += `<button class="page-btn" onclick="goToPage(1)">1</button>`;
                if (start > 2) html += `<span class="page-btn" style="cursor:default">...</span>`;
            }
            
            for (let i = start; i <= end; i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }
            
            if (end < totalPages) {
                if (end < totalPages - 1) html += `<span class="page-btn" style="cursor:default">...</span>`;
                html += `<button class="page-btn" onclick="goToPage(${totalPages})">${totalPages}</button>`;
            }
            
            html += `<button class="page-btn" onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>→</button>`;
            
            paginationDiv.innerHTML = html;
        }

        function goToPage(page) {
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            search();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showPerson(id) {
            const modal = document.getElementById('modal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            
            modal.classList.add('active');
            modalTitle.textContent = 'Duke ngarkuar...';
            modalBody.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

            api(`person?id=${id}`).then(p => {
                if (!p || p.error) {
                    modalBody.innerHTML = '<p>Gabim në ngarkimin e të dhënave</p>';
                    return;
                }

                modalTitle.textContent = `${p.Emer || ''} ${p.Mbiemer || ''}`;

                // Father - use person's own Atesi field, try to make clickable if found
                let fatherHtml = p.father_name || '—';
                let fatherParentsHtml = '';
                if (p.father && p.father.id) {
                    fatherHtml = `<span class="detail-value clickable" onclick="closeModal();setTimeout(() => showPerson(${p.father.id}), 100)">${p.father_name}</span>`;
                    if (p.father.atesi) {
                        fatherParentsHtml = `<div class="detail-value small" style="margin-top:4px;">Stërgjyshërit: ${p.father.atesi} & ${p.father.amesi || '—'}</div>`;
                    }
                }

                // Mother - use person's own Amesi field, try to make clickable if found
                let motherHtml = p.mother_name || '—';
                let motherParentsHtml = '';
                if (p.mother && p.mother.id) {
                    motherHtml = `<span class="detail-value clickable" onclick="closeModal();setTimeout(() => showPerson(${p.mother.id}), 100)">${p.mother_name}</span>`;
                    if (p.mother.atesi) {
                        motherParentsHtml = `<div class="detail-value small" style="margin-top:4px;">Stërgjyshërit: ${p.mother.atesi} & ${p.mother.amesi || '—'}</div>`;
                    }
                }

                // Family
                let familyHtml = '';
                if (p.family && p.family.length > 0) {
                    familyHtml = `
                        <div class="detail-section">
                            <div class="detail-section-title">Anëtarë të Familjes</div>
                            ${p.family.filter(f => f.Id !== p.Id).map(f => `
                                <div class="family-member" onclick="closeModal();setTimeout(() => showPerson(${f.Id}), 100)">
                                    <span class="family-name">${f.Emer || ''} ${f.Mbiemer || ''}</span>
                                    <span class="family-role">${f.Lidhja || ''}</span>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                modalBody.innerHTML = `
                    <div class="detail-section">
                        <div class="detail-section-title">Të Dhëna Personale</div>
                        <div class="detail-grid">
                            <div class="detail-item">
                                <div class="detail-label">Emri</div>
                                <div class="detail-value">${p.Emer || ''} ${p.Mbiemer || ''}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">ID</div>
                                <div class="detail-value" style="font-family:var(--font-mono)">${p.KryefId || '—'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Atesi</div>
                                <div class="detail-value">${fatherHtml}${fatherParentsHtml}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Amesi</div>
                                <div class="detail-value">${motherHtml}${motherParentsHtml}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Data e Lindjes</div>
                                <div class="detail-value">${formatDate(p.Dtlindja)}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Vendlindja</div>
                                <div class="detail-value">${p.Vlindja || '—'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Gjinia</div>
                                <div class="detail-value">${p.Seksi || '—'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Gjendja Civile</div>
                                <div class="detail-value">${p.GjCivile || '—'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Kombësia</div>
                                <div class="detail-value">${p.Kombesia || '—'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Qyteti</div>
                                <div class="detail-value">${p.Qyteti || '—'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Regjistri</div>
                                <div class="detail-value">${p.EmriRegj || '—'} Nr. ${p.NrRegj || '—'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Lidhja</div>
                                <div class="detail-value">${p.LidhjaKryef || '—'}</div>
                            </div>
                        </div>
                    </div>
                    ${familyHtml}
                `;
            });
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modal')) closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        loadStats();
        search();
    </script>
</body>
</html>
