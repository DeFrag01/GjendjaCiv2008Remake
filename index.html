<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regjistri i Gjendjes Civile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1a2744;
  --navy-dark:#121d33;
  --blue:#2c5282;
  --blue-light:#ebf0f7;
  --blue-muted:#6b8bb5;
  --bg:#ffffff;
  --bg-subtle:#f7f8fa;
  --text:#1a1f2e;
  --text-secondary:#5a6577;
  --text-muted:#8e96a8;
  --border:#e2e6ed;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono','SF Mono',monospace;
  --space-xs:4px;--space-sm:8px;--space-md:16px;--space-lg:24px;--space-xl:32px;--space-2xl:48px;--space-3xl:64px
}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex;
  flex-direction:column
}

/* header */
.header{
  background:var(--navy);
  color:#fff;
  padding:var(--space-2xl) var(--space-xl);
  border-bottom:3px solid var(--navy-dark)
}
.header-inner{max-width:1100px;margin:0 auto}
.header-top{margin-bottom:var(--space-xl)}
.header h1{
  font-size:28px;font-weight:600;letter-spacing:-0.01em;
  margin-bottom:4px;text-wrap:balance
}
.header-sub{
  font-size:13px;font-weight:400;color:rgba(255,255,255,.55);
  text-transform:uppercase;letter-spacing:.08em
}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:var(--space-xs);
  max-width:520px
}
.stat{
  padding:var(--space-md) 0;
  border-top:1px solid rgba(255,255,255,.12)
}
.stat-value{
  font-size:30px;font-weight:600;letter-spacing:-0.02em;line-height:1.2
}
.stat-label{
  font-size:11px;text-transform:uppercase;letter-spacing:.08em;
  color:rgba(255,255,255,.45);margin-top:2px
}

/* main */
.main{
  max-width:1100px;margin:0 auto;
  padding:var(--space-2xl) var(--space-xl) var(--space-3xl);
  flex:1
}

/* search */
.search-section{margin-bottom:var(--space-xl)}
.search-row{
  display:grid;
  grid-template-columns:1fr auto;
  border:1px solid var(--border);
  transition:border-color .15s
}
.search-row:focus-within{border-color:var(--blue)}
.search-input{
  padding:12px var(--space-md);
  font-size:16px;font-family:var(--font);
  border:none;background:transparent;color:var(--text);
  outline:none
}
.search-input::placeholder{color:var(--text-muted)}
.search-btn{
  padding:12px 24px;font-size:13px;font-weight:500;
  font-family:var(--font);background:var(--navy);color:#fff;
  border:none;cursor:pointer;
  text-transform:uppercase;letter-spacing:.06em;
  transition:background .15s
}
.search-btn:hover{background:var(--navy-dark)}
.search-btn:active{transform:scale(.98)}

.quick-search{
  display:flex;flex-wrap:wrap;
  gap:var(--space-xs);margin-top:var(--space-md);
  align-items:center
}
.quick-label{
  font-size:11px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--text-muted);
  margin-right:var(--space-sm)
}
.quick-btn{
  padding:3px 10px;font-size:12px;font-family:var(--font-mono);
  background:var(--blue-light);color:var(--blue);
  border:none;cursor:pointer;letter-spacing:.01em;
  transition:opacity .15s
}
.quick-btn:hover{opacity:.7}

/* results header */
.results-header{
  display:flex;justify-content:space-between;
  align-items:center;margin-bottom:var(--space-md);
  padding-bottom:var(--space-md);
  border-bottom:1px solid var(--border)
}
.results-count{font-size:14px;color:var(--text-secondary)}
.results-count strong{color:var(--text);font-weight:500}

/* table */
.table-wrap{border:1px solid var(--border);overflow:hidden}
.table{width:100%;border-collapse:collapse}
.table th{
  text-align:left;padding:8px var(--space-md);
  font-size:11px;font-weight:500;
  text-transform:uppercase;letter-spacing:.06em;
  color:var(--text-muted);background:var(--bg-subtle);
  border-bottom:1px solid var(--border);
  white-space:nowrap
}
.table td{
  padding:10px var(--space-md);
  border-bottom:1px solid var(--border);
  vertical-align:middle;font-size:14px
}
.table tbody tr{cursor:pointer;transition:background .12s}
.table tbody tr:last-child td{border-bottom:none}
.table tbody tr:hover{background:var(--blue-light)}
.person-name{font-weight:500;font-size:15px}
.person-id{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:1px}
.row-meta{font-size:13px;color:var(--text-secondary);line-height:1.4}
.row-meta strong{color:var(--text);font-weight:500}
.row-meta .sep{color:var(--border);margin:0 6px}
.tag{
  display:inline-block;padding:1px 8px;font-size:10px;
  font-weight:500;text-transform:uppercase;
  letter-spacing:.04em;border-radius:999px;margin-right:4px
}
.tag-m{background:#ebf0f7;color:var(--blue)}
.tag-f{background:#f7eaea;color:#8b3a3a}
.tag-default{background:var(--bg-subtle);color:var(--text-muted)}

/* pagination */
.pagination{
  display:flex;justify-content:center;
  gap:var(--space-xs);margin-top:var(--space-xl)
}
.page-btn{
  min-width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-family:var(--font);
  background:var(--bg);border:1px solid var(--border);
  color:var(--text-secondary);cursor:pointer;
  transition:all .12s
}
.page-btn:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.page-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.page-btn:disabled{opacity:.25;cursor:not-allowed}
.page-btn:disabled:hover{background:var(--bg);color:var(--text-secondary);border-color:var(--border)}

/* modal */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(26,31,46,.45);
  z-index:1000;align-items:center;justify-content:center;
  padding:var(--space-xl)
}
.modal-overlay.active{display:flex}
.modal{
  background:var(--bg);max-width:640px;width:100%;
  max-height:85vh;overflow-y:auto;
  border:1px solid var(--border);
  box-shadow:0 4px 24px rgba(26,31,46,.12)
}
.modal-header{
  display:flex;justify-content:space-between;
  align-items:center;padding:20px var(--space-lg);
  border-bottom:1px solid var(--border)
}
.modal-title{
  font-size:20px;font-weight:600;letter-spacing:-0.01em
}
.modal-close{
  width:32px;height:32px;display:flex;
  align-items:center;justify-content:center;
  background:var(--bg-subtle);border:1px solid var(--border);
  color:var(--text-secondary);font-size:14px;cursor:pointer;
  transition:all .12s
}
.modal-close:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.modal-body{padding:var(--space-lg)}

.detail-section{margin-bottom:var(--space-xl)}
.detail-section:last-child{margin-bottom:0}
.detail-section-title{
  font-size:10px;font-weight:500;text-transform:uppercase;
  letter-spacing:.1em;color:var(--text-muted);
  margin-bottom:var(--space-md);padding-bottom:var(--space-sm);
  border-bottom:1px solid var(--border)
}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.detail-item{padding:12px 0;border-bottom:1px solid var(--border)}
.detail-item:nth-last-child(-n+2){border-bottom:none}
.detail-label{
  font-size:10px;text-transform:uppercase;
  letter-spacing:.08em;color:var(--text-muted);margin-bottom:4px
}
.detail-value{font-size:14px;font-weight:500}
.detail-value.clickable{color:var(--blue);cursor:pointer;transition:opacity .12s}
.detail-value.clickable:hover{opacity:.7}
.detail-value.small{font-size:12px;color:var(--text-secondary);font-weight:400}

.family-list{border:1px solid var(--border)}
.family-member{
  display:flex;justify-content:space-between;
  align-items:center;padding:12px var(--space-md);
  border-bottom:1px solid var(--border);cursor:pointer;
  transition:background .12s
}
.family-member:last-child{border-bottom:none}
.family-member:hover{background:var(--bg-subtle)}
.family-name{font-weight:500;font-size:14px}
.family-role{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}

/* loading */
.loading{text-align:center;padding:80px 20px}
.spinner{
  width:24px;height:24px;
  border:1.5px solid var(--border);border-top-color:var(--navy);
  border-radius:50%;animation:spin .7s linear infinite;
  margin:0 auto var(--space-sm)
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em}

.no-results{
  text-align:center;padding:80px 20px;
  border:1px solid var(--border)
}
.no-results h3{font-size:16px;font-weight:500;margin-bottom:8px}
.no-results p{font-size:13px;color:var(--text-secondary)}

/* footer */
.footer{
  text-align:center;padding:var(--space-lg) var(--space-xl);
  border-top:1px solid var(--border);
  color:var(--text-muted);font-size:11px;
  text-transform:uppercase;letter-spacing:.08em
}

/* responsive */
@media(max-width:768px){
  .header{padding:var(--space-xl) var(--space-md);text-align:center}
  .header h1{font-size:22px}
  .stats{grid-template-columns:1fr;max-width:none}
  .main{padding:var(--space-xl) var(--space-md) var(--space-2xl)}
  .search-row{grid-template-columns:1fr}
  .table th:nth-child(4),.table td:nth-child(4){display:none}
  .detail-grid{grid-template-columns:1fr}
  .detail-item:nth-last-child(-n+2){border-bottom:1px solid var(--border)}
  .detail-item:last-child{border-bottom:none}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-top">
      <h1>Regjistri i Gjendjes Civile</h1>
      <div class="header-sub">Republika e Shqip&euml;ris&euml; &mdash; N&euml;ntor 2008</div>
    </div>
    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="statTotal">&mdash;</div>
        <div class="stat-label">T&euml; Dh&euml;na</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="statLastNames">&mdash;</div>
        <div class="stat-label">Mbiemra</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="statFirstNames">&mdash;</div>
        <div class="stat-label">Emra</div>
      </div>
    </div>
  </div>
</header>

<main class="main">
  <div class="search-section">
    <div class="search-row">
      <input type="text" id="searchInput" class="search-input" placeholder="K&euml;rko em&euml;r, mbiem&euml;r, ID&hellip;" autocomplete="off">
      <button class="search-btn" onclick="performSearch()">K&euml;rko</button>
    </div>
    <div class="quick-search">
      <span class="quick-label">K&euml;rkime t&euml; shpejta:</span>
      <button class="quick-btn" onclick="quickSearch('HOXHA')">HOXHA</button>
      <button class="quick-btn" onclick="quickSearch('BANO')">BANO</button>
      <button class="quick-btn" onclick="quickSearch('HADERI')">HADERI</button>
      <button class="quick-btn" onclick="quickSearch('DUKA')">DUKA</button>
      <button class="quick-btn" onclick="quickSearch('XHUVANI')">XHUVANI</button>
    </div>
  </div>

  <div class="results-header">
    <span class="results-count" id="resultsCount"></span>
  </div>

  <div id="results"></div>
  <div id="pagination" class="pagination"></div>
</main>

<footer class="footer">
  Regjistri i Gjendjes Civile &mdash; 4,220,323 t&euml; dh&euml;na
  <br>&copy; 2026 DeFrag01
</footer>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle"></span>
      <button class="modal-close" onclick="closeModal()">&#10005;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
let currentPage=1,totalPages=1,currentQuery='';

async function api(e){const r=await fetch(`/api/${e}`);return r.json()}

function loadStats(){
  api('stats').then(d=>{
    document.getElementById('statTotal').textContent=d.total?.toLocaleString()||'0';
    document.getElementById('statLastNames').textContent=d.uniqueLastNames?.toLocaleString()||'0';
    document.getElementById('statFirstNames').textContent=d.uniqueFirstNames?.toLocaleString()||'0'
  })
}

function performSearch(){currentQuery=document.getElementById('searchInput').value.trim();currentPage=1;search()}
function quickSearch(t){document.getElementById('searchInput').value=t;performSearch()}

function search(){
  const r=document.getElementById('results');
  r.innerHTML=`<div class="loading"><div class="spinner"></div><div class="loading-text">Duke ngarkuar</div></div>`;
  document.getElementById('resultsCount').textContent='Duke ngarkuar';
  api(`search?q=${encodeURIComponent(currentQuery)}&page=${currentPage}`).then(d=>{
    totalPages=d.pages;renderResults(d.results);renderPagination();
    document.getElementById('resultsCount').innerHTML=
      `<strong>${d.total.toLocaleString()}</strong> rezultate${currentQuery?` p&euml;r &ldquo;${currentQuery}&rdquo;`:''}`
  })
}

function formatDate(d){
  if(!d)return'&mdash;';
  const p=d.split(' ');
  if(!p[0])return'&mdash;';
  const parts=p[0].split('/');
  if(parts.length!==3)return p[0];
  let y=parts[2];
  if(y.length===2){const n=parseInt(y);y=n>25?'19'+y:'20'+y}
  return `${parts[0]}/${parts[1]}/${y}`
}

function tagHtml(l){
  if(!l||l==='&mdash;')return'';
  const c=l==='Mashkull'||l==='M'?'tag-m':l==='Fem&euml;r'||l==='F'?'tag-f':'tag-default';
  return`<span class="tag ${c}">${l}</span>`
}

function renderResults(r){
  const rd=document.getElementById('results');
  if(!r||!r.length){
    rd.innerHTML=`<div class="no-results"><h3>Nuk u gjet asnj&euml; rezultat</h3><p>Provoni t&euml; ndryshoni k&euml;rkimin tuaj</p></div>`;
    return
  }
  rd.innerHTML=`
    <div class="table-wrap">
      <table class="table">
        <thead><tr><th>Emri</th><th>At&euml;</th><th>Lindja / Qyteti</th><th>Gjendja</th></tr></thead>
        <tbody>${r.map(p=>`
          <tr onclick="showPerson(${p.id})">
            <td>
              <div class="person-name">${p.emer||''} ${p.mbiemer||''}</div>
              <div class="person-id">${p.kryefId||'&mdash;'}</div>
            </td>
            <td class="row-meta"><strong>${p.atesi||'&mdash;'}</strong></td>
            <td class="row-meta">${formatDate(p.dtlindja)}<span class="sep">|</span>${p.qyteti||'&mdash;'}</td>
            <td>${tagHtml(p.seksi)} ${tagHtml(p.gjCivile)}</td>
          </tr>`).join('')}</tbody>
      </table>
    </div>`
}

function renderPagination(){
  const p=document.getElementById('pagination');
  if(totalPages<=1){p.innerHTML='';return}
  let h='';
  h+=`<button class="page-btn" onclick="goToPage(${currentPage-1})" ${currentPage===1?'disabled':''}>&larr;</button>`;
  const s=Math.max(1,currentPage-2),e=Math.min(totalPages,currentPage+2);
  if(s>1){h+=`<button class="page-btn" onclick="goToPage(1)">1</button>`;if(s>2)h+=`<span class="page-btn" style="cursor:default;border-color:transparent;background:transparent">&hellip;</span>`}
  for(let i=s;i<=e;i++)h+=`<button class="page-btn ${i===currentPage?'active':''}" onclick="goToPage(${i})">${i}</button>`;
  if(e<totalPages){if(e<totalPages-1)h+=`<span class="page-btn" style="cursor:default;border-color:transparent;background:transparent">&hellip;</span>`;h+=`<button class="page-btn" onclick="goToPage(${totalPages})">${totalPages}</button>`}
  h+=`<button class="page-btn" onclick="goToPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>&rarr;</button>`;
  p.innerHTML=h
}

function goToPage(p){if(p<1||p>totalPages)return;currentPage=p;search();window.scrollTo({top:0,behavior:'smooth'})}

function showPerson(id){
  const m=document.getElementById('modal'),mt=document.getElementById('modalTitle'),mb=document.getElementById('modalBody');
  m.classList.add('active');mt.textContent='Duke ngarkuar';mb.innerHTML='<div class="loading"><div class="spinner"></div></div>';
  api(`person?id=${id}`).then(p=>{
    if(!p||p.error){mb.innerHTML='<p>Gabim n&euml; ngarkimin e t&euml; dh&euml;nave</p>';return}
    mt.textContent=`${p.Emer||''} ${p.Mbiemer||''}`;

    let fh=p.father_name||'&mdash;',fph='';
    if(p.father&&p.father.id){
      fh=`<span class="detail-value clickable" onclick="closeModal();setTimeout(()=>showPerson(${p.father.id}),100)">${p.father_name}</span>`;
      if(p.father.atesi)fph=`<div class="detail-value small" style="margin-top:4px">St&euml;rgjysh&euml;rit: ${p.father.atesi} &amp; ${p.father.amesi||'&mdash;'}</div>`
    }
    let mh=p.mother_name||'&mdash;',mph='';
    if(p.mother&&p.mother.id){
      mh=`<span class="detail-value clickable" onclick="closeModal();setTimeout(()=>showPerson(${p.mother.id}),100)">${p.mother_name}</span>`;
      if(p.mother.atesi)mph=`<div class="detail-value small" style="margin-top:4px">St&euml;rgjysh&euml;rit: ${p.mother.atesi} &amp; ${p.mother.amesi||'&mdash;'}</div>`
    }
    let fam='';
    if(p.family&&p.family.length){
      fam=`
        <div class="detail-section">
          <div class="detail-section-title">An&euml;tar&euml; t&euml; Familjes</div>
          <div class="family-list">${p.family.filter(f=>f.Id!==p.Id).map(f=>`
            <div class="family-member" onclick="closeModal();setTimeout(()=>showPerson(${f.Id}),100)">
              <span class="family-name">${f.Emer||''} ${f.Mbiemer||''}</span>
              <span class="family-role">${f.Lidhja||''}</span>
            </div>`).join('')}</div>
        </div>`
    }
    mb.innerHTML=`
      <div class="detail-section">
        <div class="detail-section-title">T&euml; Dh&euml;na Personale</div>
        <div class="detail-grid">
          <div class="detail-item"><div class="detail-label">Emri</div><div class="detail-value">${p.Emer||''} ${p.Mbiemer||''}</div></div>
          <div class="detail-item"><div class="detail-label">ID</div><div class="detail-value" style="font-family:var(--font-mono);font-size:13px">${p.KryefId||'&mdash;'}</div></div>
          <div class="detail-item"><div class="detail-label">Atesi</div><div class="detail-value">${fh}${fph}</div></div>
          <div class="detail-item"><div class="detail-label">Amesi</div><div class="detail-value">${mh}${mph}</div></div>
          <div class="detail-item"><div class="detail-label">Data e Lindjes</div><div class="detail-value">${formatDate(p.Dtlindja)}</div></div>
          <div class="detail-item"><div class="detail-label">Vendlindja</div><div class="detail-value">${p.Vlindja||'&mdash;'}</div></div>
          <div class="detail-item"><div class="detail-label">Gjinia</div><div class="detail-value">${p.Seksi||'&mdash;'}</div></div>
          <div class="detail-item"><div class="detail-label">Gjendja Civile</div><div class="detail-value">${p.GjCivile||'&mdash;'}</div></div>
          <div class="detail-item"><div class="detail-label">Komb&euml;sia</div><div class="detail-value">${p.Kombesia||'&mdash;'}</div></div>
          <div class="detail-item"><div class="detail-label">Qyteti</div><div class="detail-value">${p.Qyteti||'&mdash;'}</div></div>
          <div class="detail-item"><div class="detail-label">Regjistri</div><div class="detail-value" style="font-size:13px">${p.EmriRegj||'&mdash;'} Nr. ${p.NrRegj||'&mdash;'}</div></div>
          <div class="detail-item"><div class="detail-label">Lidhja</div><div class="detail-value">${p.LidhjaKryef||'&mdash;'}</div></div>
        </div>
      </div>${fam}`
  })
}

function closeModal(){document.getElementById('modal').classList.remove('active')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeModal()})
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()})
document.getElementById('searchInput').addEventListener('keypress',e=>{if(e.key==='Enter')performSearch()})
loadStats();search()
</script>
</body>
</html>
